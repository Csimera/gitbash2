<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biró Botond</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Űrlap</h1>
        </header>
        <nav>
            <ul>
                <li><a href="index.html">Menü</a></li>
                <li><a href="index.html">Menü</a></li>
                <li><a href="index.html">Menü</a></li>
            </ul>
        </nav>
        <article>
                <form>
                  <fieldset>
                    <legend>Személyes adatok</legend>
                    <div id="szemelyesadatok">
                      <div class="nev">
                        <label for="nev">Név:</label>
                        <input type="text" id="nev" name="nev" value="" placeholder="Vezetéknév Keresztnév">
                      </div>
                      <div class="psw">
                        <label for="psw">Jelszó:</label>
                        <input type="password" name="psw" id="psw">
                      </div>
                      <div class="emai">
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="email@gmail.com">
                      </div>
                    </div>
                    </fieldset>
                    <fieldset>
                      <legend>Autó választás</legend>
                      <div id="auto">
                        <label for="auto">Válassz egy autót:</label>
                        <select name="auto" id=" auto" size="3">
                          <option value="audi">audi</option>
                          <option value="toj">toj</option>
                          <option value="suzuki">suzuki</option>
                        </select>
                      </div>
                    </fieldset>
                    <fieldset>
                      <legend>Írd le a véleményed a tojásról:</legend>
                      <div>
                        <textarea name="message" id="message" rows="10" cols="30"></textarea>
                      </div>
                    </fieldset>
                    <fieldset>
                      <legend>Kedvenc szín</legend>
                      <div id="kedvencszin">
                        <label for="szin">Kedvenc színed:</label>
                        <input type="color" name="szin" id="szin">
                      </div>
                    </fieldset>
                    <fieldset>
                      <legend>Önéletrajz</legend>
                      <div id="oneletrajz">
                        <label for="cv">Töltsd fel az önéletrajzodat:</label>
                        <input type="file" name="cv" id="cv">
                      </div>
                    </fieldset>
                    <div class="gombok">
                      <input type="submit" value="Küldés">
                      <input type="reset" value="Törlés">
                    </div>
                </form>
        </article>
        <footer>
            <p>Biró Botond</p>
        </footer>
    </main>
</body>
</html>
